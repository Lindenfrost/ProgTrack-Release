[pytest]
testpaths = tests
norecursedirs = archive .git .pytest_cache __pycache__ build dist
addopts = -m "not extended_heritage and not phase4_heritage and not isolated_qt and not release_package"
filterwarnings =
    error::SyntaxWarning
markers =
    extended_heritage: expensive full-seed Heritage render and pixel audits; run explicitly in Phase 4
    release_package: checks that require an assembled release package; run with tests/run_phase3_package_acceptance.py
    phase4_heritage: Heritage Track plugin, rendering, layout, cache, or interaction coverage deferred to Phase 4
    isolated_qt: Qt regression test run in a child process to contain platform-specific native widget lifetime crashes
    non_blocking_benchmark: informational performance benchmark; functional correctness remains blocking
